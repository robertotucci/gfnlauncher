id: io.github.robertotucci.GfnLauncher

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

# Supplies zypak, which is what lets Chromium's own sandbox work inside
# Flatpak's rather than having to be turned off with --no-sandbox.
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24

command: gfn-launcher

finish-args:
  # ── Display and hardware ────────────────────────────────────────────────────
  - --share=ipc
  # Both, and in this order, because Electron 43 defaults its Ozone platform
  # hint to `auto`: it sees WAYLAND_DISPLAY in the environment and goes looking
  # for a Wayland socket before anything else. Granting only X11 does not
  # quietly fall back — it prints "Failed to initialize Wayland platform" and
  # exits, which is exactly what the first sandboxed run did.
  #
  # Wayland-native is also the configuration the launcher is already tested in:
  # on a Wayland desktop the .deb and the AppImage take the same path, and
  # `stepAside()` in src/main/ipc.ts drops fullscreen before minimising
  # precisely because an iconify request aimed at a fullscreen surface is a
  # hint every Wayland compositor may ignore.
  #
  # `fallback-x11` rather than `x11`: X11 access is then granted only on
  # sessions that are not Wayland, instead of always.
  - --socket=wayland
  - --socket=fallback-x11
  # The web-player fallback (src/main/gfn/webStream.ts) streams a game in a
  # window we own, and a silent stream is not a stream.
  - --socket=pulseaudio
  # The gamepad, via /dev/input — without which this launcher cannot be
  # operated at all — and the GPU, via /dev/dri. `--device=input` alone would
  # be tighter but is newer than the flatpak on some target systems, and
  # --device=all is what covers both on every version.
  - --device=all

  # ── Network ─────────────────────────────────────────────────────────────────
  # The catalogue, NVIDIA's sign-in page, and the status board.
  - --share=network

  # ── The host ────────────────────────────────────────────────────────────────
  # This is effectively an exit from the sandbox, and there is no way around it
  # for an app whose entire purpose is to drive another Flatpak.
  #
  # `flatpak-spawn --host` needs it (src/main/host.ts), and five things depend
  # on that: starting the GeForce NOW client with a deep link on its argv —
  # there is no portal for "run this Flatpak with these arguments", and the
  # deep link is an argv, not a URI scheme; stopping a client that is already
  # running, which is not optional, because a running client silently swallows
  # the link and the user gets no game and no error; reading the client's
  # version; `systemctl suspend|reboot|poweroff` for the power menu; and
  # writing the XDG autostart entry into the user's real ~/.config/autostart,
  # which is done through here precisely so that
  # `--filesystem=xdg-config/autostart:create` does not have to be a second
  # permission on top of this one.
  #
  # Revoking it is safe: the launcher reports what is missing and how to
  # restore it, rather than claiming GeForce NOW is not installed.
  - --talk-name=org.freedesktop.Flatpak

  # ── Files ───────────────────────────────────────────────────────────────────
  # Which datacenter the client is set to stream from, for the Status screen.
  # Read-only, and the parser returns six declared fields, because that file
  # also holds a live bearer token and the machine's MAC address.
  - --filesystem=~/.var/app/com.nvidia.geforcenow:ro
  # The client's own service configuration, so NVIDIA's hostnames are read
  # rather than hardcoded (src/main/gfn/appConfig.ts). Both installation roots,
  # since GeForce NOW may be installed per-user or system-wide; a missing one
  # is not an error, and an unreadable config degrades to a known fallback.
  - --filesystem=~/.local/share/flatpak/app/com.nvidia.geforcenow:ro
  - --filesystem=/var/lib/flatpak/app/com.nvidia.geforcenow:ro

build-options:
  append-path: /usr/lib/sdk/node24/bin

modules:
  - name: gfn-launcher
    buildsystem: simple

    build-options:
      append-path: /usr/lib/sdk/node24/bin
      env:
        # Flathub builds with no network, so every byte has to come from the
        # sources below. Both caches were populated by flatpak-node-generator,
        # and npm is told never to reach out past them.
        npm_config_cache: /run/build/gfn-launcher/flatpak-node/npm-cache
        npm_config_offline: 'true'
        npm_config_audit: 'false'
        npm_config_fund: 'false'
        # The esbuild and node-gyp caches flatpak-node-generator writes. Not
        # where Electron comes from — see --config.electronDist below for why
        # populating the download cache is not enough.
        XDG_CACHE_HOME: /run/build/gfn-launcher/flatpak-node/cache
        # Belt and braces beside --ignore-scripts: electron's own install script
        # is the other thing that would try to fetch the ~100 MB binary.
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    build-commands:
      # --ignore-scripts is not only about electron: the build must not run
      # arbitrary lifecycle scripts from 691 packages with no network to fail
      # against. esbuild resolves its binary from the @esbuild/linux-x64
      # platform package, so it does not need its own postinstall.
      - npm ci --offline --ignore-scripts

      # typecheck + vite build for main, preload and renderer.
      - npm run build

      # `dir` only: no AppImage, no deb, so electron-builder needs neither
      # appimagetool nor fpm.
      #
      # electronDist is what keeps this offline, and populating the download
      # cache is *not* an alternative — that was the first thing tried and it
      # fails with EAI_AGAIN. Even with the zip sitting in the cache at exactly
      # the path it writes to, @electron/get re-fetches SHASUMS256.txt to
      # validate it, every time, and that fetch is not cached. Pointed at a
      # directory instead, electron-builder finds `electron-v<ver>-linux-x64.zip`
      # by name and extracts it in-process with no network and no 7za.
      #
      # The path is the one flatpak-node-generator already downloads the binary
      # to, so this costs no second copy — and naming the directory rather than
      # the file keeps the version out of this manifest, where it would be a
      # third place to remember to bump.
      - >-
        ./node_modules/.bin/electron-builder --linux dir --publish=never
        --config.electronDist=/run/build/gfn-launcher/flatpak-node/cache/electron

      # The app itself, then the wrapper that starts it through zypak.
      - mkdir -p /app/gfn-launcher
      - cp -a release/linux-unpacked/. /app/gfn-launcher/
      - install -Dm755 flatpak/gfn-launcher.sh /app/bin/gfn-launcher

      # Icons under the app id, which is what the .desktop entry names and what
      # a Wayland compositor matches an app_id against.
      #
      # One physical line on purpose: in a YAML folded scalar a more-indented
      # continuation keeps its newline, which splits `install` from its
      # destination and fails with "missing destination file operand".
      # Stops at 512: `flatpak build-export` refuses anything larger with
      # "Image too large (1024x1024). Max. size 512x512", so the 1024px PNG that
      # ships in the .deb has no home here.
      - 'for s in 32 48 64 128 256 512; do install -Dm644 "resources/icons/${s}x${s}.png" "/app/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png"; done'

      # resources/icon.svg is deliberately *not* installed as a scalable icon.
      # `appstreamcli compose`, which flatpak-builder runs at the end of every
      # build, cannot rasterise SVG inside org.flatpak.Builder and fails the
      # whole build with `icon-file-read-error`. Nothing is lost: the PNG set
      # above is rendered from that SVG at each size precisely so a hairline
      # stroke stays crisp at 32px instead of being downscaled from 1024.

      - install -Dm644 flatpak/${FLATPAK_ID}.desktop
        /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml
        /app/share/metainfo/${FLATPAK_ID}.metainfo.xml

    sources:
      # The working tree, minus everything that is generated. Skipping
      # node_modules matters for more than speed: a host-installed tree would
      # shadow the offline one npm ci is about to build, and the build would
      # quietly link against whatever this machine happened to have.
      #
      # Released builds replace this one source with a pinned git source; see
      # scripts/make-flathub-manifest.mjs.
      - type: dir
        path: ..
        skip:
          - node_modules
          - out
          - dist
          - release
          - build-dir
          - repo
          - .flatpak-builder
          - .git

      # Everything the build downloads, as individually checksummed sources:
      # ~630 npm tarballs plus the Electron binary in @electron/get's cache
      # layout. Derived from package-lock.json, never edited by hand —
      # regenerate with `npm run flatpak:sources` after any dependency change.
      - generated-sources.json

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
