id: io.github.robertotucci.GfnLauncher

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

# Supplies zypak, which is what lets Chromium's own sandbox work inside
# Flatpak's rather than having to be turned off with --no-sandbox.
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24

command: gfn-launcher

finish-args:
  # ── Display and hardware ────────────────────────────────────────────────────
  - --share=ipc
  # Both, and in this order, because Electron 43 defaults its Ozone platform
  # hint to `auto`: it sees WAYLAND_DISPLAY in the environment and goes looking
  # for a Wayland socket before anything else. Granting only X11 does not
  # quietly fall back — it prints "Failed to initialize Wayland platform" and
  # exits, which is exactly what the first sandboxed run did.
  #
  # Wayland-native is also the configuration the launcher is already tested in:
  # on a Wayland desktop the .deb and the AppImage take the same path, and
  # `stepAside()` in src/main/ipc.ts drops fullscreen before minimising
  # precisely because an iconify request aimed at a fullscreen surface is a
  # hint every Wayland compositor may ignore.
  #
  # `fallback-x11` rather than `x11`: X11 access is then granted only on
  # sessions that are not Wayland, instead of always.
  - --socket=wayland
  - --socket=fallback-x11
  # The web-player fallback (src/main/gfn/webStream.ts) streams a game in a
  # window we own, and a silent stream is not a stream.
  - --socket=pulseaudio
  # The gamepad, via /dev/input — without which this launcher cannot be
  # operated at all — and the GPU, via /dev/dri. `--device=input` alone would
  # be tighter but is newer than the flatpak on some target systems, and
  # --device=all is what covers both on every version.
  - --device=all
  # The udev database, read-only, and it is the other half of the line above:
  # without it a pad that was already switched on when the launcher started is
  # invisible until it is unplugged and plugged back in.
  #
  # Chromium does not decide what is a gamepad by opening the device node. Its
  # Linux data fetcher asks libudev for `ID_INPUT_JOYSTICK`, and reads
  # `ID_VENDOR_ID` and `ID_BUS` for the pad id the footer legend is drawn from —
  # all three are written by udevd into /run/udev/data, and none of them is in
  # /sys. Flatpak gives the sandbox its own /run, so that directory is simply
  # absent: enumeration at startup then finds every input device and no
  # properties on any of them. Measured inside this sandbox against libudev
  # directly — 38 input devices, 7 carrying an `ID_INPUT_*` property on the host,
  # 0 in here — and the Electron binary contains all three property names.
  #
  # Hotplug worked throughout, which is what made this read as a pad fault
  # rather than a permission: a udev *monitor* event arrives over netlink
  # carrying the whole property set already computed, so switching the pad off
  # and on again fixed it every time and starting the launcher never did.
  - --filesystem=/run/udev:ro

  # ── Network ─────────────────────────────────────────────────────────────────
  # The catalogue, NVIDIA's sign-in page, and the status board.
  - --share=network

  # ── The host ────────────────────────────────────────────────────────────────
  # This is effectively an exit from the sandbox, and there is no way around it
  # for an app whose entire purpose is to drive another Flatpak.
  #
  # `flatpak-spawn --host` needs it (src/main/host.ts), and six things depend
  # on that: starting the GeForce NOW client with a deep link on its argv —
  # there is no portal for "run this Flatpak with these arguments", and the
  # deep link is an argv, not a URI scheme; stopping a client that is already
  # running, which is not optional, because a running client silently swallows
  # the link and the user gets no game and no error; reading the client's
  # version; `systemctl suspend|reboot|poweroff` for the power menu; writing
  # the XDG autostart entry into the user's real ~/.config/autostart, which is
  # done through here precisely so that
  # `--filesystem=xdg-config/autostart:create` does not have to be a second
  # permission on top of this one; and `flatpak update <this app id>` when the
  # user confirms the launcher's own update notice (src/main/update/), which
  # runs nothing but this application's own update and reads
  # `flatpak info --show-commit` either side of it to know whether anything
  # actually moved.
  #
  # Revoking it is safe: the launcher reports what is missing and how to
  # restore it, rather than claiming GeForce NOW is not installed.
  - --talk-name=org.freedesktop.Flatpak

  # ── Keeping the screen on ───────────────────────────────────────────────────
  # `prevent-display-sleep` (src/main/displaySleep.ts) is a D-Bus Inhibit call,
  # and Chromium picks whichever of these the session provides: GNOME answers on
  # org.gnome.SessionManager, KDE and Xfce on org.freedesktop.PowerManagement,
  # and org.freedesktop.ScreenSaver is the interface the freedesktop idle
  # specification defines. Three names rather than --socket=session-bus, which
  # would be the whole bus for one call.
  #
  # This is the one permission whose absence the launcher cannot report. Inside
  # the sandbox the blocked call still returns a valid blocker id and
  # `isStarted()` still says true — there is nothing to detect. What the user
  # sees is the original bug: a screen that blanks while they are browsing.
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.freedesktop.ScreenSaver

  # ── Typing outside our own windows ──────────────────────────────────────────
  # LB + RB in pointer mode (src/main/pointer/systemKeyboard.ts). Our own
  # on-screen keyboard is drawn by a preload into a page we own, so it cannot
  # follow the cursor onto the desktop or into a game — an Electron overlay was
  # measured on KDE Wayland and takes the focus, which is exactly what decides
  # where a keystroke lands. A compositor's own keyboard is a layer-shell
  # surface and does not, so the request is forwarded to it: one property read,
  # one `forceActivate`, and the pad clicks its keys with the cursor it already
  # has.
  #
  # **KDE is the only desktop that can be asked**, because there is no
  # cross-desktop protocol for "show the on-screen keyboard": GNOME has one and
  # raises it for touch input with no way to request it, and every other desktop
  # has none at all. So this is one branch of a per-desktop question rather than
  # the only answer, and the launcher resolves the desktop from
  # `XDG_CURRENT_DESKTOP` — which flatpak does forward into the sandbox — before
  # it opens a bus. Away from KDE it never makes this call, which is also what
  # keeps a KDE-shaped error message off a GNOME user's screen.
  #
  # Not fatal on KDE either, and deliberately: `available` comes back false on a
  # session without a virtual keyboard, and KDE declines to raise the one it has
  # for anything but touch. Every one of those ends at the same place — the
  # launcher composes the text in a window of its own — with one line in the log
  # saying which. Revoking this permission looks like "KWin did not answer" and
  # the message says how to put it back.
  - --talk-name=org.kde.KWin

  # ── Which keyboard the person actually has ──────────────────────────────────
  # systemd-localed's `X11Layout`, read-only, and it decides what that composed
  # keyboard *is* (src/main/pointer/systemKeyboard.ts, `readSystemLayout`).
  #
  # The layout is asked for in the order the session is most likely to know it:
  # `XKB_DEFAULT_LAYOUT` from the environment, then the desktop's own setting —
  # `org.kde.KeyboardLayouts` on KDE, `org.gnome.desktop.input-sources` through
  # the host on the GNOME family — and then this, which is the only source that
  # answers on Xfce, MATE, LXQt, a bare compositor and any X11 session alike.
  # Without it those desktops fall through to the session *language*, and a
  # language is not a layout: an English desktop on an Italian keyboard would be
  # drawn a US board, and the thing being typed on it is a password.
  #
  # Nothing here is privileged — localed needs polkit for `Set*` and for nothing
  # else, and this only ever reads a property. Revoking it costs a keyboard
  # layout and never the keyboard: the call answers `ServiceUnknown`, the chain
  # moves on to the locale, and the launcher writes one line saying where the
  # layout came from.
  - --system-talk-name=org.freedesktop.locale1

  # ── Pairing a Bluetooth device ──────────────────────────────────────────────
  # BlueZ (src/main/bluetooth/), and the only name this application needs on the
  # *system* bus. Everything the Devices screen does — enumerate, discover,
  # pair, connect, forget, power the adapter — is an ordinary org.bluez call,
  # the same ones the desktop's own Bluetooth panel makes as the same
  # unprivileged user. There is no polkit on this path and nothing here is
  # elevated: BlueZ's shipped D-Bus policy grants `send_destination="org.bluez"`
  # to the default context, which is why a user session can pair a headset at
  # all.
  #
  # It has to be `talk` rather than `see`, and that is the half worth writing
  # down: BlueZ does not pair on its own. It hands the interactive part of a
  # pairing to an *agent* — a D-Bus object this application exports — so
  # bluetoothd calls **back into the sandbox** while a pairing is running, and
  # only `talk` permits that direction. With `see` the confirmation never
  # arrives and the pairing fails with nothing on screen to say why.
  #
  # Revoking it is safe and legible: every call answers
  # org.freedesktop.DBus.Error.AccessDenied, and `describeBluezError` turns that
  # into the `flatpak override` line that grants it back. Nothing else in the
  # launcher is affected.
  - --system-talk-name=org.bluez

  # ── Files ───────────────────────────────────────────────────────────────────
  # The GeForce NOW client's own state directory, read-only, for two things.
  #
  # Which datacenter the client is set to stream from, for the Status screen —
  # `sharedstorage.json`, whose parser returns six declared fields because that
  # file also holds a live bearer token and the machine's MAC address.
  #
  # And when a game has finished: the client does not exit when a stream ends,
  # it returns to its own mall holding the screen, and `logs/gameStreamClientAgent.log`
  # is the only place that fact is recorded (src/main/gfn/streamLog.ts). Revoking
  # this costs the Status screen's nameplate and the launcher closing the client
  # for you afterwards; games still launch either way.
  - --filesystem=~/.var/app/com.nvidia.geforcenow:ro
  # The client's own service configuration, so NVIDIA's hostnames are read
  # rather than hardcoded (src/main/gfn/appConfig.ts). Both installation roots,
  # since GeForce NOW may be installed per-user or system-wide; a missing one
  # is not an error, and an unreadable config degrades to a known fallback.
  - --filesystem=~/.local/share/flatpak/app/com.nvidia.geforcenow:ro
  - --filesystem=/var/lib/flatpak/app/com.nvidia.geforcenow:ro

build-options:
  append-path: /usr/lib/sdk/node24/bin

modules:
  - name: gfn-launcher
    buildsystem: simple

    build-options:
      append-path: /usr/lib/sdk/node24/bin
      env:
        # Flathub builds with no network, so every byte has to come from the
        # sources below. Both caches were populated by flatpak-node-generator,
        # and npm is told never to reach out past them.
        npm_config_cache: /run/build/gfn-launcher/flatpak-node/npm-cache
        npm_config_offline: 'true'
        npm_config_audit: 'false'
        npm_config_fund: 'false'
        # The esbuild and node-gyp caches flatpak-node-generator writes. Not
        # where Electron comes from — see --config.electronDist below for why
        # populating the download cache is not enough.
        XDG_CACHE_HOME: /run/build/gfn-launcher/flatpak-node/cache
        # Belt and braces beside --ignore-scripts: electron's own install script
        # is the other thing that would try to fetch the ~100 MB binary.
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    build-commands:
      # --ignore-scripts is not only about electron: the build must not run
      # arbitrary lifecycle scripts from 691 packages with no network to fail
      # against. esbuild resolves its binary from the @esbuild/linux-x64
      # platform package, so it does not need its own postinstall.
      - npm ci --offline --ignore-scripts

      # typecheck + vite build for main, preload and renderer.
      - npm run build

      # `dir` only: no AppImage, no deb, so electron-builder needs neither
      # appimagetool nor fpm.
      #
      # electronDist is what keeps this offline, and populating the download
      # cache is *not* an alternative — that was the first thing tried and it
      # fails with EAI_AGAIN. Even with the zip sitting in the cache at exactly
      # the path it writes to, @electron/get re-fetches SHASUMS256.txt to
      # validate it, every time, and that fetch is not cached. Pointed at a
      # directory instead, electron-builder finds `electron-v<ver>-linux-x64.zip`
      # by name and extracts it in-process with no network and no 7za.
      #
      # The path is the one flatpak-node-generator already downloads the binary
      # to, so this costs no second copy — and naming the directory rather than
      # the file keeps the version out of this manifest, where it would be a
      # third place to remember to bump.
      - >-
        ./node_modules/.bin/electron-builder --linux dir --publish=never
        --config.electronDist=/run/build/gfn-launcher/flatpak-node/cache/electron

      # The app itself, then the wrapper that starts it through zypak.
      - mkdir -p /app/gfn-launcher
      - cp -a release/linux-unpacked/. /app/gfn-launcher/
      - install -Dm755 flatpak/gfn-launcher.sh /app/bin/gfn-launcher

      # Icons under the app id, which is what the .desktop entry names and what
      # a Wayland compositor matches an app_id against.
      #
      # One physical line on purpose: in a YAML folded scalar a more-indented
      # continuation keeps its newline, which splits `install` from its
      # destination and fails with "missing destination file operand".
      # Stops at 512: `flatpak build-export` refuses anything larger with
      # "Image too large (1024x1024). Max. size 512x512", so the 1024px PNG that
      # ships in the .deb has no home here.
      - 'for s in 32 48 64 128 256 512; do install -Dm644 "resources/icons/${s}x${s}.png" "/app/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png"; done'

      # resources/icon.svg is deliberately *not* installed as a scalable icon.
      # `appstreamcli compose`, which flatpak-builder runs at the end of every
      # build, cannot rasterise SVG inside org.flatpak.Builder and fails the
      # whole build with `icon-file-read-error`. Nothing is lost: the PNG set
      # above is rendered from that SVG at each size precisely so a hairline
      # stroke stays crisp at 32px instead of being downscaled from 1024.

      - install -Dm644 flatpak/${FLATPAK_ID}.desktop
        /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml
        /app/share/metainfo/${FLATPAK_ID}.metainfo.xml

    sources:
      # The working tree, minus everything that is generated. Skipping
      # node_modules matters for more than speed: a host-installed tree would
      # shadow the offline one npm ci is about to build, and the build would
      # quietly link against whatever this machine happened to have.
      #
      # Released builds replace this one source with a pinned git source; see
      # scripts/make-flathub-manifest.mjs.
      - type: dir
        path: ..
        skip:
          - node_modules
          - out
          - dist
          - release
          - build-dir
          - repo
          - .flatpak-builder
          - .git

      # Everything the build downloads, as individually checksummed sources:
      # ~630 npm tarballs plus the Electron binary in @electron/get's cache
      # layout. Derived from package-lock.json, never edited by hand —
      # regenerate with `npm run flatpak:sources` after any dependency change.
      - generated-sources.json

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
