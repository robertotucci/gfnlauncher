name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANIFEST: flatpak/io.github.robertotucci.GfnLauncher.yml
  APP_ID: io.github.robertotucci.GfnLauncher

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # A tag whose version does not match package.json produces artefacts named
      # after one number and a changelog entry under another, which is only ever
      # discovered by whoever downloads them.
      - name: Tag matches package.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          packaged="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag $tag does not match package.json ($packaged)"
            exit 1
          fi

      - name: Changelog has an entry for this release
        run: |
          version="$(node -p "require('./package.json').version")"
          grep -q "^## \[$version\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          }

  native:
    name: AppImage and deb
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # `--publish never` lives in the npm script rather than here: it is not a
      # CI concern. electron-builder publishes implicitly whenever HEAD carries
      # a git tag, so anyone running `npm run build:linux` with a release tag
      # checked out gets the same "GitHub Personal Access Token is not set"
      # failure — after building both artefacts, which makes it look like a
      # packaging problem rather than what it is.
      - run: npm run build:linux

      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Add Flathub
        run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime and SDK
        run: |
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08 \
            org.freedesktop.Sdk.Extension.node24//25.08

      - name: Build
        run: |
          flatpak-builder --force-clean --user --disable-rofiles-fuse \
            --repo=repo build-dir "$MANIFEST"

      - name: Validate AppStream metadata
        run: appstreamcli validate --explain build-dir/files/share/metainfo/*.metainfo.xml

      - name: Bundle
        run: |
          version="$(node -p "require('./package.json').version")"
          flatpak build-bundle repo "GfnLauncher-${version}.flatpak" "$APP_ID" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: '*.flatpak'
          if-no-files-found: error

      # Tarred rather than uploaded as a directory: an archive repository is
      # tens of thousands of small objects, and the upload action costs one
      # request each.
      - name: Archive the OSTree repository
        run: tar -cf ostree-repo.tar repo

      - uses: actions/upload-artifact@v4
        with:
          name: ostree-repo
          path: ostree-repo.tar
          if-no-files-found: error
          retention-days: 1

  remote:
    name: Flatpak remote
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Deliberately *not* `ref: inputs.tag`, unlike every other job here. What
      # this job needs from the tree is the publishing machinery rather than
      # the application, and the application arrives as an artefact already
      # built from the tag. Checking out the tag would mean an older release
      # could only ever be republished with the script as it stood then — and
      # v0.1.0 predates the script entirely, so it could not be republished at
      # all. The default is the ref that triggered the run: the tag on a tag
      # push, the default branch on a manual one, and both carry the script.
      - uses: actions/checkout@v5

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree

      - uses: actions/download-artifact@v4
        with:
          name: ostree-repo

      - run: tar -xf ostree-repo.tar

      # No passphrase on this key by design: it signs in CI, unattended, and a
      # passphrase in a second secret beside it protects nothing. It signs this
      # repository and nothing else, and is revocable on its own.
      - name: Import the signing key
        env:
          PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY is not set — see RELEASING.md"
            exit 1
          fi
          printf '%s' "$PRIVATE_KEY" | gpg --batch --quiet --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          echo "GPG_KEY_ID=$key" >> "$GITHUB_ENV"

      # The published branch is the previous state of the repository, and the
      # new commit is written on top of it so that an installed copy can update
      # by delta. Absent on the very first release, which is not an error.
      - name: Fetch the published repository
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pages
            rm -rf pages/.git
          else
            echo "No gh-pages branch yet; starting a new repository"
            mkdir pages
          fi

      - name: Publish
        run: ./scripts/publish-flatpak-remote.sh repo pages

      # A fresh orphan commit every time, force-pushed. The OSTree repository
      # keeps its own history inside these files, so keeping a git history of
      # them as well would store every release's ninety megabytes for ever and
      # walk the repository into GitHub's size limits within a year.
      - name: Push
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          cd pages
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish $version"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages

  publish:
    name: Publish release
    needs: [native, remote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The changelog is the single source for release notes, the AppStream
      # <releases> block, and this body — written once, read three times.
      - name: Extract release notes
        run: |
          version="$(node -p "require('./package.json').version")"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/      { exit }
            inside                  { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo '## Install'
            echo
            echo '**Recommended — adds the remote, so this and every later version update themselves:**'
            echo
            echo '```bash'
            echo 'flatpak remote-add --if-not-exists --user gfnlauncher \'
            echo '  https://robertotucci.github.io/gfnlauncher/gfnlauncher.flatpakrepo'
            echo 'flatpak install --user gfnlauncher io.github.robertotucci.GfnLauncher'
            echo '```'
            echo
            echo '**Or the bundle below, which needs no remote and does not update itself:**'
            echo
            echo '```bash'
            echo "flatpak install --user ./GfnLauncher-${version}.flatpak"
            echo '```'
            echo
            echo 'Requires the official GeForce NOW Flatpak (`com.nvidia.geforcenow`) and a gamepad.'
            echo 'See the [README](https://github.com/robertotucci/gfnlauncher#install) for the AppImage and .deb, and for what sandbox permissions the Flatpak asks for and why.'
          } >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
