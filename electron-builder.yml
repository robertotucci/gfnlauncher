# Reverse-DNS off the code-hosting URL rather than a domain, because Flathub
# verifies ownership of whatever the id claims: `io.github.<user>.<App>` needs
# only the GitHub account, where `dev.rtucci.*` would need rtucci.dev to serve a
# verification file. It also has to be settled before the first public release —
# the id names the Flatpak's private directory (~/.var/app/<id>), so changing it
# later strands every user's settings, catalog cache and play history.
appId: io.github.robertotucci.GfnLauncher
productName: GFN Launcher
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  # The `?asset` import in src/main/index.ts compiles to a path back out of
  # out/main into this file rather than copying it, so the allow-list has to
  # carry it or the packaged window has no icon. The rest of the set is the
  # installer's business, not the app's, and the .svg source ships nowhere.
  - resources/icons/512x512.png
  - '!**/*.map'
linux:
  # fpm writes this into the .deb control file and refuses to build without it.
  # Set here rather than as `author` in package.json so the field reads as what
  # it is — who packages this, not who wrote it — and a GitHub noreply address
  # so a package that may get passed around carries no real inbox.
  maintainer: robertotucci <robertotucci@users.noreply.github.com>
  # Electron takes its Wayland app_id / X11 WM_CLASS from `desktopName` in
  # package.json; this makes electron-builder name the generated entry to match
  # and write the same value into StartupWMClass. Without the pair, a KDE or
  # GNOME Wayland session cannot tie the running window to the .desktop entry —
  # and since the entry is where the icon lives on Wayland, the taskbar falls
  # back to a generic placeholder no matter what the window itself carries.
  syncDesktopName: true
  # A directory, so every hicolor size ships rendered from resources/icon.svg
  # rather than downscaled from one large PNG. It lives beside the app rather
  # than in buildResources because src/main/index.ts imports one of these files
  # for the window icon — one source, two consumers.
  icon: resources/icons
  target:
    - AppImage
    - deb
  # Both categories, and they have to be set *here*. `linux.desktop.entry` is
  # merged into the generated entry first and then `Categories` is overwritten
  # from this field unconditionally — app-builder-lib's LinuxTargetHelper does
  # the assignment after the merge — so a `Categories:` under `entry` below is
  # silently dropped, which is what happened for four releases and left the deb
  # and the AppImage filed under Game alone. GNOME Software and Discover both
  # place an application from this string.
  category: Game;Network
  synopsis: Gamepad-driven couch launcher for NVIDIA GeForce NOW
  desktop:
    entry:
      Name: GFN Launcher
      # **Load-bearing, and it was missing from these two builds.** The session
      # only mints a startup id — an `XDG_ACTIVATION_TOKEN` under Wayland — for
      # an entry that asks for one, and Chromium consumes that token to activate
      # its first window. Without it a Wayland toplevel cannot activate itself
      # and the compositor's focus-stealing prevention is entitled to decline,
      # which leaves the launcher on screen, unfocused, holding no display wake
      # lock, at the front of a fresh session with no keyboard in the room.
      #
      # The Flatpak's hand-written entry has always carried it and so does the
      # autostart entry `src/main/autostart.ts` writes; only the entry
      # electron-builder generates did not, so the menu-launched deb and
      # AppImage were the two ways in that lacked it. Nothing in the default
      # `desktopMeta` supplies it — see ARCHITECTURE.md, "Autostart".
      StartupNotify: 'true'
deb:
  # The AppStream metainfo, at an absolute path, which is fpm's `source=dest`
  # operand and the only route electron-builder leaves open for a file outside
  # the app directory.
  #
  # Without it a software centre has the .desktop entry and nothing else: no
  # summary, no screenshots, no release notes, no branding colours — all of
  # which the Flatpak has had since the first release from the same file. The
  # `<launchable type="desktop-id">` inside it already names
  # `io.github.robertotucci.GfnLauncher.desktop`, which is what `desktopName`
  # and `syncDesktopName` make electron-builder call the generated entry, so the
  # two match with nothing further to keep in step.
  fpm:
    - >-
      flatpak/io.github.robertotucci.GfnLauncher.metainfo.xml=/usr/share/metainfo/io.github.robertotucci.GfnLauncher.metainfo.xml
npmRebuild: false
